
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Prediction</title>
    <style>
      /* Container with max-width ~ Bootstrap's 800px + margin auto */
      .container {
        max-width: 800px;
        margin: 1.5rem auto; /* mt-4 */
        background: transparent;
        color: black;
        border-radius: 10px;
        padding: 1rem 1.25rem;
      }

      /* Text center */
      .text-center {
        text-align: center;
      }

      /* Heading margin top 8 ~ Bootstrap mt-8 = 3rem */
      h1.mt-8 {
        margin-top: 3rem;
      }

      /* Form label */
      label.form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      /* Input file style similar to Bootstrap form-control */
      input[type="file"] {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-family: inherit;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }
      input[type="file"]:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }

      /* Button style similar to btn btn-primary mt-2 */
      button.btn {
        display: inline-block;
        font-weight: 600;
        color: #fff;
        background-color: #0d6efd;
        border: 1px solid #0d6efd;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 0.375rem;
        cursor: pointer;
        margin-top: 0.5rem; /* mt-2 */
        transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
      }
      button.btn:hover {
        background-color: #0b5ed7;
        border-color: #0a58ca;
      }
      button.btn:focus {
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.5);
      }

      /* Text danger (red text) */
      .text-danger {
        color: #dc3545;
        margin-top: 1rem;
      }

      /* Image styling similar to img-fluid rounded */
        img.img-fluid {
        max-width: 100%;
        height: auto;
        border-radius: 0.375rem;
        display: inline-block;
        margin-top: 1rem;
    }

      /* Paragraph margins to mimic Bootstrap spacing */
      p.mt-3 {
        margin-top: 1rem;
      }

      /* Responsive adjustments */
      @media (max-width: 576px) {
        .container {
          width: 95%;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="text-center mt-8">Potato Disease Classification</h1>
    <div class="container">
      <h1 class="text-center"></h1>

      <!-- Camera and File Upload Options -->
      <form action="/" method="post" enctype="multipart/form-data" class="mb-4">
        <label for="fileInput" class="form-label">Choose an image file:</label>
        <input
          type="file"
          id="fileInput"
          name="file"
          accept=".jpg, .jpeg, .png"
          class="form-control"
        />
        <button type="submit" class="btn btn-primary">Predict</button>
        <br />
        <br />

        {% if message %}
        <p class="text-danger">{{ message }}</p>
        {% endif %}

        {% if image_path %}
        <img src="{{ image_path }}" alt="Uploaded Image" class="img-fluid rounded" />
        <p class="mt-3">Actual Label: {{ actual_label }}</p>
        <p>Predicted Label: {{ predicted_label }}</p>
        <p>Confidence: {{ confidence }}%</p>
        {% endif %}
      </form>
    </div>
  </body>
</html>
